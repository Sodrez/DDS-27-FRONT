<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <HEAder>
        <H1>TRABALHANDO COM INPUTS</H1>
    </HEAder>

    <!-- INPUT -->
    <MAIN>
        <H2>FORMULÁRIO DE CADASTRO</H2>

        <!-- INPUT - COLETA DE INFORMAÇÕES DO USUÁRIO-->
            <!-- FORM - ENGLOBA OS CAMPOS DO FORMULÁRIO  -->
            <!-- ACTION - PARA ONDE A INFORMAÇÃO VAI -->
            <!-- METHOD - COMO A INFORMAÇÃO VAI -->
            <FORM action="" method="">


                <!-- label - texto de apoio para guiar o input-->
                 <!-- forma 1 - label sem input-->
                <label for="idnomeCompleto"> Nome Completo: </label>
                <!-- Text - caracteres em geral -->
                <!-- name - usado para identificar o input quando enviar os dados -->
                <!-- id - indentificação daquele elemento html -->
                <input type="text" name="nomeCompleto" id="idnomeCompleto">

                <br>
                <br>
                <!-- forma 2 - input dentro do label -->
                <label for="">
                    Senha:
                    <!-- password - senhas -->
                    <input type="password">
                </label>

            </FORM>



    </MAIN>

    <FOOTER>
        <P>DIREITOS SÃO MEUS, EU QUE FIZ TUDO</P>
    </FOOTER>



</body>
</html>
