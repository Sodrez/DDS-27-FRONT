<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<form action="">

    <!-- fildset - segmenta visualmente o formulário -->
    <fieldset>
        <!-- legend - titulo do segmento de formulário -->
        <legend> Dados Pessoais</legend>

        <!-- Caixinha de nome -->
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome">
        <!-- Fim da caixinha de nome-->

<br><br>

        <!-- Caixinha data de nascimento -->
        <label for="nome">Data de nascimento</label>
        <!-- date - apenas datas  -->
        <input type="date" name="nome" id="nome">
        <!-- datetima-local = data e hora juntos -->
        <input type="datetime-local">
        <!-- time - apenas hora -->
        <input type="time">
        <!-- Fim Caixinha data de nascimento -->

<br><br>

        <!-- Caxina de numero -->
        <label for="filhos"> Quantidade de filhos:</label>
        <input type="number" name="filhos" id="filhos" min="-3" max="69" step="0.7" value="5">
        <!-- Fim caixinha de números -->




    </fieldset>



</form>







</body>
</html>
