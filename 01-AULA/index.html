<!-- Indica que o arquivo esta em html --> 
<!DOCTYPE html>

<!-- Define a linguagem da página -->
<html lang="pt-BR">

<!-- Configura o arquivo -->
<head>
    <!-- CHARSET: Define os caracteres que podem ser utilizados-->
    <meta charset="UTF-8">
    <!-- Define uma escala inicial de visualização -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo do arquivo -->
    <title>Document</title>
</head>

<!-- define o conteudo do arquivo -->
<body>
    tu vens, tu vens
</body>
</html>
